spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:be/.env[.properties]
  application:
    name: aeroflow-hub
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    protocol: ${MAIL_PROTOCOL:smtp}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aeroflow_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

app:
  ingestion:
    quarantine:
      retention-days: ${QUARANTINE_RETENTION_DAYS:30}
      cleanup-cron: ${QUARANTINE_CLEANUP_CRON:0 15 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Supply a Base64-encoded key with at least 256 bits of entropy.
      secret: ${JWT_SECRET_BASE64}
      expiration: ${JWT_EXPIRATION_MS:900000}
