spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:be/.env[.properties]
  application:
    name: aeroflow-hub
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    protocol: ${MAIL_PROTOCOL:smtp}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aeroflow_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:9092}

app:
  auth:
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  ingestion:
    quarantine:
      retention-days: ${QUARANTINE_RETENTION_DAYS:30}
      cleanup-cron: ${QUARANTINE_CLEANUP_CRON:0 15 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY_BASE64:}
    jwt:
      # No usable default: JwtService fails startup unless this decodes to at least 32 bytes.
      # JWT_SECRET_BASE64 is the documented variable; APP_SECURITY_JWT_SECRET is the Spring alias.
      secret: ${JWT_SECRET_BASE64:${APP_SECURITY_JWT_SECRET:}}
      expiration: ${JWT_EXPIRATION_MS:900000}
